<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gypsy Cartel – Software Activation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #0b0f14;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}
.container {
    max-width: 480px;
    margin: 80px auto;
    padding: 30px;
    background: #121821;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255,122,24,0.15);
}
h1 { text-align:center; color:#ff7a18; }
p { text-align:center; color:#ccc; font-size:14px; }
input, button {
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:6px;
    border:none;
    font-size:15px;
    box-sizing: border-box; /* ഇന്റർഫേസ് അലൈൻമെന്റ് കൃത്യമാക്കാൻ */
}
input {
    background:#0b0f14;
    color:white;
    border:1px solid #ff7a1844;
}
input:focus {
    outline: none;
    border-color: #ff7a18;
}
input:disabled {
    background: #171e29;
    color: #888;
    border-color: #333;
    cursor: not-allowed;
}
button {
    background:#ff7a18;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition: background 0.2s ease;
}
button:hover { background:#e66a10; }
.status { margin-top:15px; text-align:center; min-height:24px; font-size:14px; }
.success { color:#00ff9c; }
.error { color:#ff4d4d; }
.footer { margin-top:25px; text-align:center; font-size:12px; color:#888; }
.code {
    background:#0b0f14;
    border:1px dashed #ff7a18;
    padding:10px;
    margin-top:10px;
    font-weight:bold;
    color:#00ff9c;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="container">
    <h1>Gypsy Cartel</h1>
    <p>Enter your Email and License Key to activate your software.</p>

    <!-- ഇമെയിൽ വഴി നേരിട്ട് കീ ജനറേറ്റ് ചെയ്യാൻ ബാക്കെൻഡിൽ ഓട്ടോ-ക്രിയേറ്റ് ഉള്ളതുകൊണ്ട്, കീ നൽകാനുള്ള ബോക്സ് എനേബിൾഡ് ആക്കി -->
    <input id="email" placeholder="Enter Email Address">
    <input id="license" placeholder="Enter License Key (e.g. GYPSY-XXXX-...)">

    <button onclick="activate()">Activate License</button>

    <div id="status" class="status"></div>

    <div class="footer">contact@thegypsycartel.com</div>
</div>

<script>
// റെയിൽവേയിൽ റൺ ചെയ്യുന്ന നിങ്ങളുടെ ലൈവ് ബാക്കെൻഡ് URL
const API = "https://web-production-eed1e8.up.railway.app";

async function activate() {
    const email = document.getElementById("email").value.trim();
    const key = document.getElementById("license").value.trim();
    const status = document.getElementById("status");

    if (!email || !key) {
        status.innerHTML = "<span class='error'>Please enter both Email and License Key.</span>";
        return;
    }

    status.innerHTML = "Activating license...";

    // സിസ്റ്റം തിരിച്ചറിയാൻ തനതായ ഒരു HWID ജനറേറ്റ് ചെയ്യുന്നു
    const hwid = navigator.userAgent + "-" + screen.width + "x" + screen.height;

    try {
        // ബാക്കെൻഡിലെ കൃത്യമായ എൻഡ്പോയിന്റായ /activate ലേക്ക് റിക്വസ്റ്റ് അയക്കുന്നു
        const res = await fetch(API + "/activate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: key, hwid: hwid })
        });

        if (!res.ok) {
            throw new Error("Network response was not ok");
        }

        const data = await res.json();

        // ബാക്കെൻഡ് നൽകുന്ന സ്റ്റാറ്റസ് അനുസരിച്ച് മെസ്സേജുകൾ കാണിക്കുന്നു
        if (data.status === "ok") {
            // ഭാവിയിലെ ചെക്കിംഗിനായി കീയും HWID-യും ലോക്കൽ സ്റ്റോറേജിൽ സൂക്ഷിക്കാം
            localStorage.setItem("gypsy_license_key", key);
            localStorage.setItem("gypsy_hwid", hwid);
            
            status.innerHTML = 
                "<div class='success'>License activated successfully!</div>" +
                "<div class='code'>Key: " + key + "</div>";
        }
        else if (data.status === "limit") {
            status.innerHTML = "<span class='error'>Device limit reached (2 systems only).</span>";
        }
        else if (data.status === "blocked") {
            status.innerHTML = "<span class='error'>This license has been blocked.</span>";
        }
        else {
            status.innerHTML = "<span class='error'>Invalid license key.</span>";
        }

    } catch (error) {
        console.error("Error:", error);
        status.innerHTML = "<span class='error'>Unable to connect to activation server.</span>";
    }
}
</script>

</body>
</html>
