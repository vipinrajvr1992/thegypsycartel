<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Gypsy Cartel</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Gypsy Cartel is a premium digital design and software studio delivering high-performance applications, hyper-realistic 3D design, and modern UI/UX solutions.">

    <!-- SITE ICON -->
    <link rel="icon" type="image/webp" href="/assets/logos/gypsy-cartel-icon.webp">
    <link rel="apple-touch-icon" href="/assets/logos/gypsy-cartel-icon.webp">

    <!-- STYLES -->
    <link rel="stylesheet" href="/style.css">

    <!-- WhatsApp Clean Hover Zoom & Spacing -->
    <style>
        .contact-whatsapp {
            color: var(--primary-orange) !important;
            text-decoration: none;
            display: inline-block;
            margin-left: 6px; /* Overlap ഒഴിവാക്കാൻ നൽകിയ കൃത്യമായ സ്പേസ് */
            transition: transform 0.2s ease-in-out;
        }

        /* മാൗസ് കൊണ്ടുവരുമ്പോൾ മാത്രം ലൈറ്റ് Zoom */
        .contact-whatsapp:hover {
            transform: scale(1.08);
        }

        /* Privacy consent — same site theme */
        .privacy-consent {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .privacy-consent input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            min-width: 14px;
            padding: 0;
            margin: 0;
            border: 1px solid var(--primary-orange);
            border-radius: 2px;
            background: transparent;
            cursor: none !important;
            position: relative;
            flex: 0 0 14px;
        }

        .privacy-consent input[type="checkbox"]:hover,
        .privacy-consent input[type="checkbox"]:focus {
            cursor: none !important;
        }

        .privacy-consent input[type="checkbox"]:checked {
            background: var(--primary-orange);
        }

        .privacy-consent input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid #111;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        .privacy-consent label {
            margin: 0;
            cursor: none !important;
        }

        .privacy-consent a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
            cursor: none !important;
        }

        .privacy-consent a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="contact-page">

<!-- CUSTOM CURSOR -->
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<!-- HEADER (PARTIAL) -->
<div id="site-header"></div>

<!-- PAGE CONTENT -->
<div class="container">

    <h1 style="text-align:center;">
        INITIALIZE <span style="color:var(--primary-orange)">CONTACT</span>
    </h1>

    <!-- CONTACT INFO -->
    <div class="grid-3" style="text-align:center; margin-top:1rem; margin-bottom:2rem;">
        <div>
            <h4>SUPPORT &amp; BUSINESS</h4>
            <p>
                <a href="mailto:contact@thegypsycartel.com">
                    contact@thegypsycartel.com
                </a>
            </p>
        </div>

        <div>
            <h4>INSTAGRAM (CREATOR)</h4>
            <p>
                <a href="https://instagram.com/mallugypsy.creations" target="_blank">
                    @mallugypsy.creations
                </a>
            </p>
        </div>

        <div>
            <h4>LOCATION</h4>
            <p>India | UAE</p>
        </div>
    </div>

    <!-- CONTACT FORM -->
    <form id="contactForm"
          action="https://formspree.io/f/xjgkezzp"
          method="POST"
          style="max-width:900px; margin:0 auto;"
          autocomplete="on">

        <h3 style="color:var(--primary-orange); margin-bottom:20px;">
            SEND TRANSMISSION
        </h3>

        <div style="display:flex; gap:20px;">
            <input type="text" name="name" placeholder="Your Name" autocomplete="name" required>
            <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <input
            type="tel"
            name="phone"
            placeholder="Phone Number"
            autocomplete="tel"
            inputmode="tel"
            required
        >

        <textarea name="message"
                  rows="6"
                  placeholder="Your Message / Business Inquiry..."
                  required></textarea>

        <!-- Hidden metadata -->
        <input type="hidden" name="_subject" value="New Contact Inquiry - Gypsy Cartel">
        <input type="hidden" name="_template" value="table">

        <div class="privacy-consent">
            <input type="checkbox" id="privacyConsent" name="privacy_consent" value="accepted" required>
            <label for="privacyConsent">
                I agree to the processing of my personal data for responding to this enquiry,
                as described in the
                <a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
            </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">
            SUBMIT INQUIRY
        </button>

        <p id="successMsg"
           style="display:none; margin-top:20px; color:#00ff9c;">
            ✔ Message sent successfully. We’ll contact you shortly.
        </p>

        <p style="margin-top:15px; font-size:0.9rem; color:var(--text-muted);">
            Didn’t get a response?
            <a href="https://wa.me/918086604808?text=Hello%20Gypsy%20Cartel,%20I%20sent%20an%20inquiry%20via%20your%20website."
               target="_blank"
               class="contact-whatsapp">
                Contact via WhatsApp
            </a>
        </p>
    </form>
</div>

<!-- FOOTER -->
<div id="site-footer"></div>

<!-- GLOBAL SCRIPT -->
<script src="/script.js"></script>

<!-- CONTACT FORM AJAX -->
<script>
const form = document.getElementById("contactForm");
const successMsg = document.getElementById("successMsg");
const privacyConsent = document.getElementById("privacyConsent");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!privacyConsent.checked) {
        privacyConsent.reportValidity();
        return;
    }

    const formData = new FormData(form);
    const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: { "Accept": "application/json" }
    });

    if (response.ok) {
        form.reset();
        successMsg.style.display = "block";
    } else {
        alert("Something went wrong. Please try again or contact via WhatsApp.");
    }
});
</script>
