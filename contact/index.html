<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Gypsy Cartel</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Gypsy Cartel is a premium digital design and software studio delivering high-performance applications, hyper-realistic 3D design, and modern UI/UX solutions.">

    <!-- SITE ICON -->

    <link rel="apple-touch-icon" href="/assets/logos/gypsy-cartel-icon.webp">

    <!-- STYLES -->
    <link rel="stylesheet" href="/style.css">

    <!-- WhatsApp Clean Hover Zoom & Spacing -->
    <style>
        .contact-whatsapp {
            color: var(--primary-orange) !important;
            text-decoration: none;
            display: inline-block;
            margin-left: 6px;
            transition: transform 0.2s ease-in-out;
        }

        .contact-whatsapp:hover {
            transform: scale(1.08);
        }

        /* =====================================================
           PRIVACY CONSENT
        ===================================================== */

        .privacy-consent {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .privacy-consent input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;

            width: 14px;
            height: 14px;
            min-width: 14px;

            padding: 0;
            margin: 0;

            border: 1px solid var(--primary-orange);
            border-radius: 2px;
            background: transparent;

            /* IMPORTANT:
               Do not allow browser cursor to appear.
               Custom cursor is rendered separately above it. */
            cursor: none !important;

            position: relative;
            flex: 0 0 14px;

            /* Keep checkbox itself clickable */
            pointer-events: auto;

            z-index: 1;
        }

        .privacy-consent input[type="checkbox"]:checked {
            background: var(--primary-orange);
        }

        .privacy-consent input[type="checkbox"]:checked::after {
            content: "";

            position: absolute;
            left: 4px;
            top: 1px;

            width: 4px;
            height: 8px;

            border: solid #111;
            border-width: 0 1.5px 1.5px 0;

            transform: rotate(45deg);
        }

        .privacy-consent label {
            margin: 0;
            cursor: none !important;
        }

        .privacy-consent a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
            cursor: none !important;
        }

        .privacy-consent a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           CUSTOM CURSOR — CONTACT PAGE FIX
        ===================================================== */

        @media (hover: hover) and (pointer: fine) {

            body.contact-page {
                cursor: none !important;
            }

            body.contact-page *,
            body.contact-page input,
            body.contact-page textarea,
            body.contact-page button,
            body.contact-page label,
            body.contact-page a {
                cursor: none !important;
            }

            .cursor-dot,
            .cursor-outline {
                position: fixed !important;

                top: 0;
                left: 0;

                pointer-events: none !important;

                display: block !important;
                visibility: visible !important;

                z-index: 2147483647 !important;

                will-change: transform;

                opacity: 1;
            }

            .cursor-dot {
                width: 7px;
                height: 7px;

                margin-left: -3.5px;
                margin-top: -3.5px;

                border-radius: 50%;

                background: var(--primary-orange);

                box-shadow:
                    0 0 8px rgba(255, 106, 26, 0.55);

                transform: translate3d(-100px, -100px, 0);
            }

            .cursor-outline {
                width: 32px;
                height: 32px;

                margin-left: -16px;
                margin-top: -16px;

                border: 1px solid rgba(255, 106, 26, 0.75);
                border-radius: 50%;

                background: transparent;

                transform: translate3d(-100px, -100px, 0);

                transition:
                    width 0.18s ease,
                    height 0.18s ease,
                    margin 0.18s ease,
                    border-color 0.18s ease,
                    background-color 0.18s ease;
            }

            /* Hover state for clickable elements */
            body.contact-page.cursor-hover .cursor-outline {
                width: 42px;
                height: 42px;

                margin-left: -21px;
                margin-top: -21px;

                border-color: var(--primary-orange);

                background: rgba(255, 106, 26, 0.06);
            }

            /* Checkbox hover — custom cursor remains visible */
            body.contact-page.cursor-checkbox .cursor-outline {
                width: 28px;
                height: 28px;

                margin-left: -14px;
                margin-top: -14px;

                border-color: var(--primary-orange);

                background: rgba(255, 106, 26, 0.08);
            }
        }


        /* =====================================================
           MOBILE / TOUCH
           Keep normal touch behaviour.
        ===================================================== */

        @media (hover: none), (pointer: coarse) {

            body.contact-page {
                cursor: auto !important;
            }

            .cursor-dot,
            .cursor-outline {
                display: none !important;
            }

            .privacy-consent input[type="checkbox"] {
                cursor: pointer !important;
            }

            .privacy-consent label,
            .privacy-consent a {
                cursor: pointer !important;
            }
        }
    </style>
</head>

    </form>
</div>

<script src="/script.js"></script>


<!-- =====================================================
     CUSTOM CURSOR ENGINE
     Contact-page fallback/fix
===================================================== -->
<script>
(function () {

    const dot = document.querySelector(".cursor-dot");
    const outline = document.querySelector(".cursor-outline");

    if (!dot || !outline) return;

    const finePointer =
        window.matchMedia("(hover: hover) and (pointer: fine)");

    if (!finePointer.matches) return;

    let mouseX = -100;
    let mouseY = -100;

    let outlineX = -100;
    let outlineY = -100;

    let rafId = null;

    document.addEventListener("mousemove", function (event) {

        mouseX = event.clientX;
        mouseY = event.clientY;

        dot.style.transform =
            `translate3d(${mouseX}px, ${mouseY}px, 0)`;

        if (!rafId) {
            rafId = requestAnimationFrame(updateOutline);
        }
    }, { passive: true });


    function updateOutline() {

        outlineX += (mouseX - outlineX) * 0.18;
        outlineY += (mouseY - outlineY) * 0.18;

        outline.style.transform =
            `translate3d(${outlineX}px, ${outlineY}px, 0)`;

        if (
            Math.abs(mouseX - outlineX) > 0.1 ||
            Math.abs(mouseY - outlineY) > 0.1
        ) {
            rafId = requestAnimationFrame(updateOutline);
        } else {
            rafId = null;
        }
    }


    /* =====================================================
       INTERACTIVE ELEMENT HOVER
    ===================================================== */

    const interactiveElements = document.querySelectorAll(
        "a, button, input:not([type='hidden']), textarea, select, label"
    );

    interactiveElements.forEach(function (element) {

        element.addEventListener("mouseenter", function () {
            document.body.classList.add("cursor-hover");
        });

        element.addEventListener("mouseleave", function () {
            document.body.classList.remove("cursor-hover");
        });

    });


    /* =====================================================
       CHECKBOX-SPECIFIC CURSOR
    ===================================================== */

    const privacyCheckbox =
        document.getElementById("privacyConsent");

    if (privacyCheckbox) {

        privacyCheckbox.addEventListener("mouseenter", function () {

            document.body.classList.add("cursor-checkbox");

        });

        privacyCheckbox.addEventListener("mouseleave", function () {

            document.body.classList.remove("cursor-checkbox");

        });

    }


    /* =====================================================
       WINDOW / TAB SAFETY
    ===================================================== */

    document.addEventListener("mouseleave", function () {

        dot.style.opacity = "0";
        outline.style.opacity = "0";

    });

    document.addEventListener("mouseenter", function () {

        dot.style.opacity = "1";
        outline.style.opacity = "1";

    });

})();
</script>


<!-- CONTACT FORM AJAX -->
<script>
const form = document.getElementById("contactForm");
const successMsg = document.getElementById("successMsg");
const privacyConsent = document.getElementById("privacyConsent");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    if (!privacyConsent.checked) {
        privacyConsent.reportValidity();
        return;
    }

    const formData = new FormData(form);

    const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: {
            "Accept": "application/json"
        }
    });

    if (response.ok) {

        form.reset();
        successMsg.style.display = "block";

    } else {

        alert(
            "Something went wrong. Please try again or contact via WhatsApp."
        );

    }

});
</script>
