<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gypsy Types | Advanced Typing Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --bg-dark: #05050a;
            --primary: #ec4899;
            --secondary: #a855f7;
            --glass: rgba(15, 15, 25, 0.85);
            /* Touch Typing Zones */
            --z-pinky: rgba(236, 72, 153, 0.4);
            --z-ring: rgba(245, 158, 11, 0.4);
            --z-mid: rgba(16, 185, 129, 0.4);
            --z-ind: rgba(6, 182, 212, 0.4);
            --z-thmb: rgba(139, 92, 246, 0.4);
        }

        body { background-color: var(--bg-dark); color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; margin: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .neon-text { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary); }
        .glass-panel { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        
        /* Keyboard */
        .key-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
        .key { 
            background: rgba(30, 30, 40, 0.9); border: 1px solid #333; border-radius: 6px; 
            min-width: 45px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: bold; color: #888;
            transition: 0.05s; position: relative;
        }
        .key.active-key { background: var(--primary); color: #fff; transform: translateY(2px) scale(0.95); box-shadow: 0 0 15px var(--primary); }
        .key.spacebar { width: 300px; }
        .key-hint { font-size: 0.4rem; opacity: 0.6; margin-top: 2px; }

        /* Colored Zones Toggle */
        .keymap-on .fp { border-bottom: 2px solid #ec4899; color: #fbcfe8; }
        .keymap-on .fr { border-bottom: 2px solid #f59e0b; color: #fef3c7; }
        .keymap-on .fm { border-bottom: 2px solid #10b981; color: #d1fae5; }
        .keymap-on .fi { border-bottom: 2px solid #06b6d4; color: #cffafe; }
        .keymap-on .ft { border-bottom: 2px solid #8b5cf6; color: #ede9fe; }

        /* Typing Area */
        #typing-area { 
            line-height: 1.6; letter-spacing: 1px; font-size: 1.8rem;
            user-select: none; word-wrap: break-word; white-space: pre-wrap;
        }
        #typing-area span { padding: 0 1px; transition: 0.1s; }
        .c-pend { color: #666; } 
        .c-corr { color: #d8b4fe; text-shadow: 0 0 8px rgba(168, 85, 247, 0.6); } 
        .c-wrong { color: #fff; background-color: #ef4444; border-radius: 3px; } 
        .c-curr { color: #fff; background-color: rgba(255,255,255,0.15); border-radius: 3px; }
        .c-curr::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 3px; background: var(--primary); animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .shake-err { animation: shake 0.15s; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-3 glass-panel border-b border-zinc-800 z-20 relative h-[70px]">
        <div>
            <h1 class="text-xl md:text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-400 neon-glow uppercase">GYPSY TYPES</h1>
            <span class="text-[9px] text-zinc-400 tracking-widest uppercase">Rocket Engine</span>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="text-center"><p class="text-[9px] text-zinc-500 uppercase">Mode</p><p id="ui-mode" class="text-lg font-bold text-cyan-400">EASY</p></div>
            <div class="text-center"><p class="text-[9px] text-zinc-500 uppercase">WPM</p><p id="ui-wpm" class="text-xl font-black text-white">00</p></div>
            <div class="text-center"><p class="text-[9px] text-zinc-500 uppercase">Accuracy</p><p id="ui-acc" class="text-lg font-bold text-pink-400">100%</p></div>
            
            <div class="flex gap-2 border-l border-zinc-700 pl-4 ml-2">
                <button onclick="toggleSettings()" class="p-2 bg-zinc-900 rounded border border-zinc-700 hover:border-cyan-400">⚙️</button>
                <button onclick="openAuthModal()" id="profile-btn" class="px-3 py-1.5 bg-zinc-900 rounded border border-zinc-700 hover:border-pink-500 text-xs font-bold text-pink-400">LOGIN</button>
            </div>
        </div>
    </header>

    <main class="relative w-full h-[calc(100vh-70px)] flex flex-col items-center justify-center p-4">
        
        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-black/95">
            <h2 class="text-5xl md:text-7xl font-black mb-3 neon-glow text-white tracking-widest text-center uppercase">GYPSY TYPES</h2>
            <p class="text-zinc-400 mb-8 max-w-lg text-center text-sm">Select your difficulty mode to begin the typing test.</p>
            
            <div class="flex gap-4 w-full max-w-xl justify-center">
                <button onclick="startGame('EASY')" class="px-8 py-3 bg-zinc-800 text-cyan-400 font-bold rounded-lg border border-cyan-500 hover:bg-zinc-700">EASY</button>
                <button onclick="startGame('MEDIUM')" class="px-8 py-3 bg-zinc-800 text-pink-400 font-bold rounded-lg border border-pink-500 hover:bg-zinc-700">MEDIUM</button>
                <button onclick="startGame('HARD')" class="px-8 py-3 bg-zinc-800 text-red-500 font-bold rounded-lg border border-red-500 hover:bg-zinc-700">HARD</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center z-30 bg-black/95">
            <h2 class="text-4xl md:text-5xl font-black mb-2 text-white uppercase">Test Complete</h2>
            <p id="result-msg" class="text-sm text-zinc-400 mb-8">Data Logged.</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 w-full max-w-3xl">
                <div class="glass-panel p-4 rounded-xl text-center border-b-2 border-cyan-400">
                    <p class="text-[10px] text-zinc-500 font-bold">NET WPM</p>
                    <p id="res-wpm" class="text-4xl font-black text-cyan-400">00</p>
                </div>
                <div class="glass-panel p-4 rounded-xl text-center border-b-2 border-pink-500">
                    <p class="text-[10px] text-zinc-500 font-bold">ACCURACY</p>
                    <p id="res-acc" class="text-4xl font-black text-pink-400">0%</p>
                </div>
                <div class="glass-panel p-4 rounded-xl text-center border-b-2 border-purple-500">
                    <p class="text-[10px] text-zinc-500 font-bold">RAW WPM</p>
                    <p id="res-raw" class="text-4xl font-black text-purple-400">00</p>
                </div>
                <div class="glass-panel p-4 rounded-xl text-center border-b-2 border-green-500">
                    <p class="text-[10px] text-zinc-500 font-bold">ERRORS</p>
                    <p id="res-err" class="text-4xl font-black text-green-400">0</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="resetGame()" class="px-6 py-3 bg-zinc-800 text-sm font-bold rounded-lg hover:bg-zinc-700">🔄 RETAKE TEST</button>
            </div>
        </div>

        <!-- Typing Arena -->
        <div id="typing-container" class="w-full max-w-5xl opacity-0 transition-opacity duration-300 hidden flex-col items-center">
            <input type="text" id="hidden-input" class="absolute opacity-0 top-0 left-0 w-1 h-1 z-[-1]" autocomplete="off" spellcheck="false">

            <!-- HUD Control Bar -->
            <div class="w-full flex justify-between items-center mb-4 glass-panel px-4 py-2 rounded-lg">
                <div class="flex gap-3">
                    <button class="text-xs font-bold text-pink-400 bg-pink-900/30 px-3 py-1 rounded">15s</button>
                    <button class="text-xs font-bold text-zinc-400 hover:text-white px-3 py-1">30s</button>
                    <button class="text-xs font-bold text-zinc-400 hover:text-white px-3 py-1">60s</button>
                </div>
                <div id="countdown" class="text-2xl font-black text-cyan-400">15</div>
                <div class="flex gap-3">
                    <button onclick="toggleKeymap()" id="btn-keymap" class="text-xs font-bold text-yellow-400 bg-yellow-900/30 px-3 py-1 rounded border border-yellow-500">KEYMAP: ON</button>
                </div>
            </div>

            <!-- Typing Text -->
            <div id="typing-area" class="font-mono w-full bg-zinc-900/30 p-6 rounded-lg border border-zinc-800 shadow-inner"></div>
            
            <!-- Keyboard -->
            <div id="virtual-keyboard" class="mt-8 w-full max-w-4xl mx-auto pointer-events-none keymap-on"></div>
        </div>
    </main>

    <!-- Modals (Settings & Auth) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm border-cyan-500/50">
            <h3 class="text-xl font-bold mb-4 text-cyan-400 text-center uppercase">Settings</h3>
            <div class="space-y-3 mb-6">
                <div class="flex justify-between items-center bg-zinc-900/50 p-3 rounded border border-zinc-800">
                    <span class="text-xs font-bold text-zinc-300">ASMR Sounds</span>
                    <input type="checkbox" id="toggle-sound" checked class="w-4 h-4 accent-cyan-500">
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-full py-2 bg-zinc-800 text-sm font-bold rounded">CLOSE</button>
        </div>
    </div>

    <div id="auth-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm border-pink-500/50">
            <h2 class="text-xl font-black text-white text-center mb-5 uppercase neon-glow">Terminal Access</h2>
            <input type="text" id="login-email" class="w-full bg-zinc-900 border border-zinc-700 p-2.5 rounded text-white text-xs outline-none focus:border-pink-500 mb-3" placeholder="Gamer Tag or Email">
            <button onclick="handleLogin()" class="w-full py-2.5 bg-pink-600 text-white text-xs font-bold rounded hover:bg-pink-500">AUTHENTICATE</button>
            <button onclick="closeAuthModal()" class="w-full mt-3 py-1 text-zinc-500 text-[10px] hover:text-white">Cancel</button>
        </div>
    </div>

    <script>
        const dictionaries = {
            'EASY': "the quick brown fox jumps over the lazy dog and the cat sleeps on the mat with a ball of yarn",
            'MEDIUM': "JavaScript is a versatile programming language used for web development, server-side scripting, and building interactive user interfaces.",
            'HARD': "const calculateWPM = (chars, errors, time) => { return Math.max(0, Math.round(((chars - errors) / 5) / (time / 60))); };"
        };

        const fMap = {
            'fp': ['q','a','z','1','p',';','/','0','-','=','[',']',"'"],
            'fr': ['w','s','x','2','o','l','.','9'],
            'fm': ['e','d','c','3','i','k',',','8'],
            'fi': ['r','f','v','t','g','b','4','5','y','h','n','u','j','m','6','7'],
            'ft': [' ']
        };

        let mode = 'EASY', timeLimit = 15, timeLeft = 15;
        let isPlaying = false, timerInt = null, text = "", charIdx = 0, errs = 0, typed = 0;
        let setSound = true, keymapOn = true;

        const elTypeContainer = document.getElementById('typing-container');
        const elTypeArea = document.getElementById('typing-area');
        const elInp = document.getElementById('hidden-input');
        const elVkb = document.getElementById('virtual-keyboard');
        const elWpm = document.getElementById('ui-wpm');
        const elAcc = document.getElementById('ui-acc');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playThock(isErr = false) {
            if(!setSound) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = isErr ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(isErr ? 100 : 160, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function getFClass(k) {
            for(let [f, ks] of Object.entries(fMap)) if(ks.includes(k.toLowerCase())) return f;
            return '';
        }

        function buildKbd() {
            const lay = [
                ['q','w','e','r','t','y','u','i','o','p','[',']'],
                ['a','s','d','f','g','h','j','k','l',';',"'"],
                ['z','x','c','v','b','n','m',',','.','/']
            ];
            elVkb.innerHTML = '';
            lay.forEach(r => {
                let row = document.createElement('div'); row.className = 'key-row';
                r.forEach(k => {
                    let d = document.createElement('div');
                    d.className = `key ${getFClass(k)}`; d.id = `key-${k === "'" ? "quote" : k}`;
                    d.innerHTML = `<span>${k.toUpperCase()}</span>`;
                    row.appendChild(d);
                });
                elVkb.appendChild(row);
            });
            let sRow = document.createElement('div'); sRow.className = 'key-row';
            let sKey = document.createElement('div'); sKey.className = `key spacebar ${getFClass(' ')}`; sKey.id = 'key-space';
            sKey.innerHTML = `<span>SPACE</span>`;
            sRow.appendChild(sKey); elVkb.appendChild(sRow);
        }

        function startGame(selectedMode) {
            mode = selectedMode; text = dictionaries[mode];
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            elTypeContainer.style.display = 'flex';
            
            setTimeout(() => {
                elTypeContainer.style.opacity = '1';
                document.getElementById('ui-mode').innerText = mode;
                buildKbd(); resetTest();
            }, 50);
        }

        function resetTest() {
            charIdx = 0; errs = 0; typed = 0; isPlaying = false; timeLeft = timeLimit;
            clearInterval(timerInt);
            document.getElementById('countdown').innerText = timeLeft;
            elWpm.innerText = '00'; elAcc.innerText = '100%';
            
            elTypeArea.innerHTML = '';
            text.split('').forEach((c, i) => {
                let s = document.createElement('span'); s.innerText = c; s.className = i===0 ? 'c-curr' : 'c-pend';
                elTypeArea.appendChild(s);
            });
            elInp.value = ''; elInp.focus();
        }

        function resetGame() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        elInp.addEventListener('input', () => {
            if(!elInp.value) return;
            const c = elInp.value.slice(-1); elInp.value = '';
            processKey(c);
        });

        elInp.addEventListener('keydown', (e) => {
            if(!isPlaying && e.key.length === 1) {
                isPlaying = true;
                timerInt = setInterval(tick, 1000);
            }
            if(e.key === "Backspace" && charIdx > 0) {
                elTypeArea.childNodes[charIdx].className = 'c-pend';
                charIdx--;
                elTypeArea.childNodes[charIdx].className = 'c-curr';
            }
        });

        function processKey(typedChar) {
            if(charIdx >= text.length || timeLeft <= 0) return;
            const exp = text[charIdx];
            let kid = typedChar.toLowerCase();
            if(kid === ' ') kid = 'space'; if(kid === "'") kid = 'quote';
            const kel = document.getElementById('key-' + kid);
            if(kel) { kel.classList.add('active-key'); setTimeout(()=>kel.classList.remove('active-key'), 100); }

            typed++;
            if(typedChar === exp) {
                elTypeArea.childNodes[charIdx].className = 'c-corr'; playThock(false);
            } else {
                elTypeArea.childNodes[charIdx].className = 'c-wrong'; errs++; playThock(true);
                elTypeArea.classList.add('shake-err'); setTimeout(()=>elTypeArea.classList.remove('shake-err'), 150);
            }

            charIdx++;
            if(charIdx >= text.length) { endTest(); return; }
            elTypeArea.childNodes[charIdx].className = 'c-curr';
            updateLiveStats();
        }

        function tick() {
            timeLeft--; document.getElementById('countdown').innerText = timeLeft;
            updateLiveStats();
            if(timeLeft <= 0) endTest();
        }

        function updateLiveStats() {
            let m = (timeLimit - timeLeft) / 60;
            if(m > 0 && typed > 0) {
                let wpm = Math.max(0, Math.round(((typed - errs)/5) / m));
                let acc = Math.round(((typed - errs)/typed)*100);
                elWpm.innerText = wpm.toString().padStart(2,'0'); elAcc.innerText = acc + '%';
            }
        }

        function endTest() {
            isPlaying = false; clearInterval(timerInt);
            let m = (timeLimit - timeLeft) / 60; if(m===0) m=0.01;
            let net = Math.max(0, Math.round(((typed - errs)/5) / m));
            let raw = Math.round((typed/5) / m);
            let acc = typed > 0 ? Math.round(((typed - errs)/typed)*100) : 0;
            
            elTypeContainer.style.opacity = '0';
            setTimeout(() => {
                elTypeContainer.style.display = 'none';
                document.getElementById('result-screen').style.display = 'flex';
                document.getElementById('res-wpm').innerText = net;
                document.getElementById('res-raw').innerText = raw;
                document.getElementById('res-acc').innerText = acc + '%';
                document.getElementById('res-err').innerText = errs;
            }, 300);
        }

        function toggleKeymap() {
            keymapOn = !keymapOn;
            elVkb.className = keymapOn ? "mt-8 w-full max-w-4xl mx-auto pointer-events-none keymap-on" : "mt-8 w-full max-w-4xl mx-auto pointer-events-none";
            document.getElementById('btn-keymap').innerText = keymapOn ? "KEYMAP: ON" : "KEYMAP: OFF";
            document.getElementById('btn-keymap').className = keymapOn ? "text-xs font-bold text-yellow-400 bg-yellow-900/30 px-3 py-1 rounded border border-yellow-500" : "text-xs font-bold text-zinc-500 bg-zinc-900/50 px-3 py-1 rounded border border-zinc-700";
            elInp.focus();
        }

        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }
        document.getElementById('toggle-sound').addEventListener('change', e => setSound = e.target.checked);
        document.addEventListener('click', () => { if(elTypeContainer.style.display === 'flex') elInp.focus(); });

        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function handleLogin() {
            let n = document.getElementById('login-email').value.trim();
            if(n) { document.getElementById('profile-btn').innerText = n.toUpperCase(); closeAuthModal(); }
        }
    </script>
</body>
</html>
